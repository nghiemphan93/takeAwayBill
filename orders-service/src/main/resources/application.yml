spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:5432/takeaway-orders
    username: takeaway
    password: takeaway
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect